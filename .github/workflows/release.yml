# SPDX-License-Identifier: Apache-2.0

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Verify and release
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install package and release tools
        run: python -m pip install --disable-pip-version-check '.[test]'
      - name: Verify tag and package versions
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}"
          assert Path("src/meridian_storage/object_common/_version.py").read_text().strip().endswith(f'"{version}"')
          PY
      - name: Run quality gates
        run: |
          ruff format --check src tests scripts
          ruff check src tests scripts
          mypy src
          python scripts/verify_contracts.py
          pytest --cov=meridian_storage.object_common --cov-report=term-missing
      - name: Fix reproducible-build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build twice and verify
        run: |
          python -m build --no-isolation --outdir .artifacts/first
          python -m build --no-isolation --outdir .artifacts/second
          python scripts/compare_artifacts.py .artifacts/first .artifacts/second
          python scripts/verify_artifacts.py .artifacts/first/*
          mkdir release
          cp .artifacts/first/* release/
          python scripts/generate_sbom.py --output "release/meridian-storage-object-common-1.0.0.spdx.json" .artifacts/first/*
      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
      - name: Upload Python distributions for gated publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            release/*.whl
            release/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: ${{ vars.PYPI_TRUSTED_PUBLISHING_ENABLED == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/meridian-storage-object-common/
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
